name: Pinned Dependency Report
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PINNED_DEPS_DIR: .github/scripts/org-pinned-deps
  SCORECARD_VERSION: "5.1.1"

jobs:

  run-scans:
    runs-on: ubuntu-latest
    steps:

    - name: Set up Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '20'

    - name: Set up Golang for Scorecard
      uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b

    - name: Install scorecard
      run: |
        curl -fL https://github.com/ossf/scorecard/releases/download/v${{ env.SCORECARD_VERSION }}/scorecard_${{ env.SCORECARD_VERSION }}_linux_amd64.tar.gz -o scorecard_${{ env.SCORECARD_VERSION }}_linux_amd64.tar.gz 
        tar -xvf scorecard_${{ env.SCORECARD_VERSION }}_linux_amd64.tar.gz
        cp scorecard $(go env GOPATH)/bin

    - name: "Checkout code"
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - name: "Install Script Dependencies"
      working-directory: ${{ env.PINNED_DEPS_DIR }}
      run:
        npm ci

    # script requires GITHUB_TOKEN and GOPATH/bin to be on the PATH
    - name: "Generate pinned dependencies report"
      working-directory: ${{ env.PINNED_DEPS_DIR }}
      env:
        GITHUB_TOKEN: ${{ secrets.ZOWE_ROBOT_TOKEN }}
      run: node index.js

  
    - name: "Publish pinned dependencies report"
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with: 
        name: pinned-dependencies-report
        path: |
          $GITHUB_WORKSPACE/${{ env.PINNED_DEPS_DIR }}/.reports/
          ${{ env.PINNED_DEPS_DIR }}/.reports/
          .reports/
  